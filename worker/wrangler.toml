name = "el-impostor-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
FRONTEND_ORIGIN = "http://localhost:3000"
FRONTEND_ORIGINS = "http://localhost:3000"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ENGAGEMENT"
class_name = "Engagement"

# Free-plan Durable Objects must use SQLite-backed storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Engagement"]

# Production env — wrangler does not auto-inherit durable_objects across
# envs, so we redeclare the binding here. Override FRONTEND_ORIGINS when
# adding or removing public frontend domains.
[env.production]

[env.production.vars]
FRONTEND_ORIGIN = "https://juegoimpostor.app"
FRONTEND_ORIGINS = "https://juegoimpostor.app,https://www.juegoimpostor.app,https://el-impostor-djf.pages.dev"

[[env.production.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[env.production.durable_objects.bindings]]
name = "ENGAGEMENT"
class_name = "Engagement"
